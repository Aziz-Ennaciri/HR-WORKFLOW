services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile-jenkins
    container_name: jenkins
    user: root
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_home:/var/jenkins_home
      - maven-cache:/root/.m2
    restart: always

volumes:
  jenkins_home:
    external: true
    name: jenkins_home
  maven-cache:
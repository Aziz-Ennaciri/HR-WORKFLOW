services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile-jenkins
    container_name: jenkins
    user: root
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_home:/var/jenkins_home
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: always
    networks:
      - infra-network

  sonarqube:
    image: sonarqube:10-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: always
    networks:
      - infra-network

volumes:
  jenkins_home:
    external: true
    name: jenkins_home
  sonar_data:
  sonar_logs:
  sonar_extensions:

networks:
  infra-network:
    driver: bridge
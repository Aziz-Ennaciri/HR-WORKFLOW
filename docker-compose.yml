version: "3.8"

services:
  app:
    build:
      context: ./hr-workflow-backend
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:cached
    command: sleep infinity
    container_name: hr-workflow-app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - hr-network

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr_workflow_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Livefree1128*
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hr-network

  frontend:
    build:
      context: ./hr-workflow-frontend
      dockerfile: Dockerfile
      network: host
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    command: npm run dev
    container_name: hr-workflow-frontend
    depends_on:
      - app
    networks:
      - hr-network

volumes:
  postgres-data:
  node_modules:
networks:
  hr-network:
    driver: bridge

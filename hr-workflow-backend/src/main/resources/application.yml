spring:
  config:
    # Lets local runs (IDE / mvnw) pick up the repo-root .env file; real env vars still take precedence.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hr_workflow_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  sql:
    init:
      mode: never
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}
server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

google:
  credentials:
    path: classpath:google-credentials.json

  ollama:
    url: http://localhost:11434/api/generate
    default:
      model: llama3.2:3b

drive:
  storage:
    path: ${DRIVE_STORAGE_PATH:${user.home}/hr-workflow-files}

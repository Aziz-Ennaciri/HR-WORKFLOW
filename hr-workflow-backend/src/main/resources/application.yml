spring:
  config:
    # Lets local runs (IDE / mvnw) pick up the repo-root .env file; real env vars still take precedence.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hr_workflow_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}

  jpa:
    # Entities are mapped to DTOs inside service transactions; no lazy loading during view rendering.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  sql:
    init:
      mode: never

  data:
    web:
      pageable:
        max-page-size: 100
jwt:
  secret: ${JWT_SECRET}
  # Access tokens are short-lived; clients renew them with the refresh token
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

security:
  # AES-256 key (base64, 32 bytes) for secrets stored in node configs, e.g. GPT API keys
  config-encryption-key: ${CONFIG_ENCRYPTION_KEY}
  login:
    max-failures: 5
    lock-duration: PT15M
server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

google:
  credentials:
    path: classpath:google-credentials.json

  ollama:
    url: http://localhost:11434/api/generate
    default:
      model: llama3.2:3b

drive:
  # "local" stores files under drive.storage.path; "google" uses Google Drive (needs google.credentials.path)
  provider: ${DRIVE_PROVIDER:local}
  storage:
    path: ${DRIVE_STORAGE_PATH:${user.home}/hr-workflow-files}

app:
  # How email recipients reach this API, e.g. https://hr.example.com (used for download links)
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}

# Workflow engine (see ExecutionProperties for all options and defaults)
execution:
  worker:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
  retry:
    # Only transient errors (timeouts, connection failures, HTTP 5xx/429) are retried
    max-attempts: 3
    initial-backoff: 1s
    multiplier: 2.0
  sweeper:
    enabled: true
    interval: PT30S  # ISO-8601, also read by @Scheduled
    pending-grace: 30s

gpt:
  http:
    connect-timeout: 5s
    read-timeout: 120s
